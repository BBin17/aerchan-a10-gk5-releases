<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1422">
  <title>AerChan A10 GK5 固件更新</title>
  <style>
    :root { color-scheme:dark; font:16px/1.6 system-ui,"PingFang SC",sans-serif; color:#eff4ff; background:#0c1422; }
    * { box-sizing:border-box; }
    body { max-width:650px; margin:auto; padding:20px 16px 40px; }
    header { display:flex; justify-content:space-between; align-items:center; padding-bottom:14px; border-bottom:1px solid #324359; }
    header b { font:italic 800 26px system-ui,sans-serif; letter-spacing:-.06em; }
    h1 { font-size:28px; margin:24px 0 12px; }
    h2 { font-size:18px; margin:0 0 8px; }
    section { margin:12px 0; padding:16px; background:#142034; border:1px solid #324359; border-radius:10px; }
    p { margin:8px 0; }
    .muted, footer { color:#b5c3d8; font-size:14px; }
    a { color:#c1d1ff; }
    .actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px 16px; margin-top:12px; }
    .download { display:inline-flex; align-items:center; min-height:44px; padding:8px 14px; border-radius:6px; background:#b2c4ff; color:#101b36; font-weight:650; text-decoration:none; }
    [hidden] { display:none !important; }
    ol { margin:0; padding-inline-start:22px; }
    li + li { margin-top:6px; }
    footer { margin-top:20px; }
  </style>
</head>
<body>
  <header><b>AerChan</b><span>A10 / GK5</span></header>
  <main>
    <h1>固件更新</h1>
    <section aria-labelledby="release-title">
      <h2 id="release-title">下载加密固件</h2>
      <p id="release-status" role="status">正在读取最新发布版本…</p>
      <div class="actions">
        <a class="download" id="download" hidden download>下载加密固件</a>
        <a id="releases" href="https://github.com/BBin17/aerchan-a10-gk5-releases/releases">GitHub 发布记录</a>
      </div>
      <p class="muted">适用于已完成加密首刷的 A10 GK5。</p>
    </section>
    <section aria-labelledby="update-title">
      <h2 id="update-title">通过 Wi‑Fi 更新</h2>
      <ol>
        <li>手机联网时下载 <strong>.a10fw</strong>，保存到「文件」或「下载」。</li>
        <li>给转速灯稳定供电，保持熄火。手机连接 <strong>ZyRacing-RPM</strong> Wi‑Fi。</li>
        <li>用 Safari 或 Chrome 打开 <a href="http://192.168.4.1/">设备设置页</a>。展开「固件更新」，选好下载的文件，输入热点密码，点「上传并更新」。</li>
        <li>等设备重启，重新连接热点并刷新页面，核对页底的固件版本。</li>
      </ol>
    </section>
  </main>
  <footer>技术支持微信 AerChanBBin17</footer>
  <script>
    'use strict';
    async function showRelease() {
      const status = document.getElementById('release-status');
      const download = document.getElementById('download');
      try {
        const response = await fetch('./firmware/latest.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('清单读取失败');
        const release = await response.json();
        if (release.model === 'A10-GK5' && release.unreleased === true) {
          status.textContent = '暂未发布加密升级包。';
          return;
        }
        if (release.model !== 'A10-GK5' || !/^v\d{1,5}\.\d{1,5}\.\d{1,5}$/.test(release.tag) ||
            !Number.isInteger(release.size) || release.size <= 512 || release.size > 0x1e0200 ||
            !/^[0-9a-f]{64}$/.test(release.digest)) throw new Error('清单格式有误');
        const filename = 'AerChan-A10-GK5-' + release.tag + '.a10fw';
        download.href = './firmware/' + filename;
        download.download = filename;
        download.hidden = false;
        status.textContent = release.tag + ' · ' + (release.size / 1000000).toFixed(2) + ' MB';
      } catch {
        status.textContent = '暂时无法读取最新版本，请查看 GitHub 发布记录。';
      }
    }
    showRelease();
  </script>
</body>
</html>
